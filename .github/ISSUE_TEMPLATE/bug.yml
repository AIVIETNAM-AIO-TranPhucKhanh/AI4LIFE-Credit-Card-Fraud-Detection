name: 🐞 Báo lỗi
description: Lỗi code, sai số liệu, API/UI không chạy đúng
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Mức độ
      options: ["Nghiêm trọng", "Cao", "Trung bình", "Thấp"]
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Cách mà lỗi xảy ra
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Lỗi như thế nào
    validations: {required: true}
  - type: textarea
    id: screenshots
    attributes:
      label: Ảnh chụp / video
      description: Kéo thả hoặc dán (Ctrl+V) ảnh màn hình, biểu đồ sai, lỗi trên dashboard... vào đây.
    validations: {required: false}
  - type: textarea
    id: logs
    attributes:
      label: Log
      render: shell
    validations: {required: false}
  - type: input
    id: jira
    attributes:
      label: Mã Jira liên quan (có thể là lấy từ commit bị lỗi)
      placeholder: KAN-12
    validations: {required: false}
